name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly, 04:00 UTC — this is where the SECOND interpreter is covered (see the matrix below).
    - cron: "0 4 * * *"
  workflow_dispatch:

# Why the gate is SPLIT across machines (2026-08-17)
# --------------------------------------------------
# It used to be one job, and it took ~15 min. The standing explanation was that two `xdist_group`-
# pinned modules held ~470 s and ~300 s of un-parallelisable chain, so the wall was a bottleneck.
# Measured, that explanation is wrong: a 4-core runner offers ~3700 core-seconds across a 920 s
# wall and the suite genuinely uses ~80-85% of them. The longest chain is barely half the wall, and
# the rest of that worker was packed. This suite is BULK-bound, not bottleneck-bound.
#
# The confirming number was already on the record and had been read the other way round: the old
# fast lane deselected the entire expensive family — 69 of 1721 tests, every one of the chains —
# and still took 784 s against the full run's 922 s. Remove the bottleneck and you keep ~85% of the
# wall, which is what "the bulk is the cost" means.
#
# A bulk-bound suite has exactly one lever: more cores. On a public repo more cores are free, in
# units of one 4-core runner per job, so the suite is partitioned over N of them and the wall
# becomes (total core-seconds)/(4N) — until it meets the longest single chain inside a shard, which
# is where splitting the pins starts to matter and not before.
jobs:
  # The split's width lives in `scripts/shard_tests.py` as ONE Python constant, and this job is how
  # the workflow reads it instead of repeating it. Writing it in both places fails silently: a
  # matrix of [1, 2] against a split computed `--of 3` runs two thirds of the suite and goes green.
  setup:
    name: Plan the split
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      # No install, no `setup-python`: the script is stdlib-only precisely so this job is ~5 s.
      - id: plan
        run: |
          echo "shards=$(python3 scripts/shard_tests.py --matrix)" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 scripts/shard_tests.py --count)" >> "$GITHUB_OUTPUT"
          python3 scripts/shard_tests.py --list

  validate:
    name: Validation harness (py${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      # Do not cancel 3.12 because 3.11 went red, and do not cancel shard 2 because shard 1 went
      # red: when two of these disagree, the disagreement IS the finding, and cancelling the rest
      # hides which axis the split is on.
      fail-fast: false
      matrix:
        # Pushes and PRs pay for one interpreter and the nightly pays for both. This is pure-numeric
        # code whose failures have never once been interpreter-specific (the one real split in this
        # repo's history was Windows vs Linux, an axis the matrix does not even cover).
        # fromJSON is required: a matrix value must be an ARRAY, and the ternary yields a string.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.11","3.12"]' || '["3.12"]') }}
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `-n auto` = one worker per available core (4 on a standard runner; `nproc` is echoed so the
      # divisor is on the record next to the numbers it divides).
      # `--dist loadgroup` scatters tests freely EXCEPT where a module carries
      # `pytest.mark.xdist_group`, which keeps its expensive module-scoped fixtures on one worker.
      # conftest.py pins each worker to a single BLAS thread so the pool does not oversubscribe.
      #
      # NO `-q` HERE. `pyproject.toml` already sets `addopts = "-q"`, so passing it again makes it
      # `-qq`, which suppresses the `N passed in …` summary entirely — a green run and a red run
      # then end the same way on screen. Verified both ways on 2026-08-10.
      #
      # `--durations=25` is free (it only reports what pytest already timed). Per SHARD it is also
      # the only way to see a shard going chain-bound: when one file's setup approaches the shard's
      # own wall, more runners stop buying anything and the fix moves inside that file.
      - name: Run validation harness (shard ${{ matrix.shard }}/${{ needs.setup.outputs.count }})
        run: |
          echo "cores: $(nproc)"
          files=$(python scripts/shard_tests.py --shard ${{ matrix.shard }} \
                    --of ${{ needs.setup.outputs.count }})
          pytest -n auto --dist loadgroup $files --durations=25

  # The Rust migration's gate (docs/dev/rust-migration-plan.md).
  #
  # A SEPARATE job, deliberately not a step inside the three shards. Those shards install the
  # project with `pip install -e ".[dev]"` and run 1,808 tests against the pure-Python core; that
  # run is the baseline every ported model is measured against, and it must not grow a Rust
  # compile. Keeping the two apart also keeps the answer legible when they disagree: a red shard
  # is a physics regression, a red `rust` job is a port regression.
  #
  # Three things are checked here, in increasing order of what they cost to discover:
  #   1. the crates compile, are formatted, and pass clippy;
  #   2. `cargo test` — the native physics bars, plus the Cargo dependency allowlist that is the
  #      Rust half of the portability contract (plan §2.2);
  #   3. the EXISTING Python tests, unmodified, run against the Rust model via `PHYSSYNTH_RS`.
  #      That third one is the phase's actual success condition. The first two only make its
  #      failures cheap to read.
  rust:
    name: Rust core (compile, native bars, Python harness against it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PINNED, not `stable`. `clippy -- -D warnings` below turns every lint a new stable release
      # introduces into a red gate on an unrelated push, and this repo has already paid for unread
      # red runs twice. Bumping is a deliberate edit: change the version here, run
      # `cargo clippy --workspace --all-targets -- -D warnings` locally, fix what the new release
      # noticed, and land both together.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      # Rust compile times for a numeric crate are minutes and the cache is the difference between
      # tolerable and not (plan §7). Keyed on Cargo.lock, which is committed for exactly this kind
      # of reason -- a floating resolution would both miss the cache and move the numbers.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      # Runs `crates/physsynth-core/tests/` — the native energy/passivity/modal bars, and the
      # dependency allowlist. No interpreter involved, so a failure here is the physics or the
      # crate graph, never the binding.
      - name: Native validation + dependency allowlist
        run: |
          cargo test --workspace
          cargo test --workspace --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `physsynth` and `physsynth-rs` are two distributions on purpose (see
      # crates/physsynth-py/pyproject.toml): the pure-Python side stays installable on its own, so
      # the baseline it defines stays available. The wheel is abi3-py311, so this 3.12 job builds
      # and exercises the same binary a developer's 3.13/3.14 does.
      #
      # `pip install ./crates/physsynth-py` looks like it should not work -- the crate has a path
      # dependency on `../physsynth-core`, which is outside the directory being installed. It does:
      # pip builds a local directory IN TREE, so the relative path resolves and the compile lands
      # in the shared workspace `target/` that the cache step above restored. Verified 2026-08-26,
      # with and without build isolation. Do not "fix" this into a copy-out-and-build.
      - name: Install both sides
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ./crates/physsynth-py

      # Phase 0's success condition, stated as the plan states it: not "a string works" but *the
      # existing tests passing unmodified against Rust*. Not one line of `tests/` mentions Rust --
      # the substitution happens inside `physsynth/core/string_ideal.py`, gated on this variable.
      #
      # The file list is spelled out because it is a CLAIM, not a partition: these are the files
      # that exercise `IdealString` directly, and the claim is that all of them stay green with the
      # Rust model underneath. It is not the shard machinery and must not be confused for it --
      # `scripts/shard_tests.py` still owns covering the suite, over in the `validate` job.
      - name: The ideal string's own tests, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_energy.py \
            tests/test_modal.py \
            tests/test_convergence.py \
            tests/test_dispersion.py \
            tests/test_stability.py

      # Phase 1's success condition, and it is a WIDER claim than Phase 0's for a structural
      # reason: `operators` is not a model, it is what five models are built out of. Flipping
      # PHYSSYNTH_RS swings `string_stiff`, `string_damped`, `string_nonlinear`,
      # `string_geometric` and `beam` onto Rust-built matrices while all five are still Python --
      # the plan's §1.2 lever, doing what it is for.
      #
      # So this list is not "the operator tests". `tests/test_operators.py` is four tests and
      # touches none of `delta_xxxx`, `second_difference_matrix`, `biharmonic_matrix` or
      # `free_beam_stiffness` -- naming it alone would be the vacuously-green trap the plan's §5
      # correction warns about, one phase later. The files below are the ones that actually reach
      # the ported code, directly or through a model built on it. The whole-suite run is the real
      # bar and is measured in the plan's §10; this step exists to make a failure cheap to read.
      - name: The operators' clients, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_operators.py \
            tests/test_stiff_string.py \
            tests/test_damped_string.py \
            tests/test_tension_string.py \
            tests/test_geometric_energy.py \
            tests/test_beam_modal.py \
            tests/test_beam_stability.py \
            tests/test_bow_stability.py \
            tests/test_free_plate_modal.py \
            tests/test_free_plate_orthotropic.py

      # Phase 2's success condition. Two claims in one step, because the swap makes them
      # inseparable: `membrane` is a model with clients of its own, and `operators2d`'s builder
      # half is what the WHOLE plate family assembles its geometry from.
      #
      # * The membrane's own bars are in four files (energy, modal, dispersion, stability) -- the
      #   by-criterion layout the plan's §5 correction describes, not a file named after the model.
      # * `mallet` and `airbox` each hold a Membrane and drive it: the mallet strikes one, and
      #   `airbox._MembraneSurface` reaches into `.u`, `.u_prev`, `.n` and `.L` directly, once per
      #   timestep. Those are the calls that decide whether the binding's buffer contract is right,
      #   and no membrane test can see them.
      # * `plate.py` imports `rectangle_mask`, `disk_mask`, `laplacian_from_mask` and `embed` from
      #   `operators2d`, so flipping the flag puts every plate -- supported, free, orthotropic,
      #   guitar-shaped -- and the von Karman bracket on Rust-built geometry while all of them are
      #   still Python models. Same lever as Phase 1's, one dimension up. Since Phase 5's first
      #   batch it also imports the OUTLINE (`guitar_mask` and friends), which is a sharper lever
      #   again -- see the plate-outline step further down.
      #
      # `exciter` gets no list of its own on purpose: nearly every model's tests call
      # `triangular_pluck` or a raised cosine, so a list would be the suite. The whole-suite run
      # under the flag is the real bar and is measured in the plan's §11.
      - name: The membrane, its clients and the 2-D builders, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_membrane_energy.py \
            tests/test_membrane_modal.py \
            tests/test_membrane_dispersion.py \
            tests/test_membrane_stability.py \
            tests/test_mallet_energy.py \
            tests/test_mallet_signature.py \
            tests/test_mallet_wall.py \
            tests/test_airbox_membrane.py \
            tests/test_airbox_surface.py \
            tests/test_plate_modal.py \
            tests/test_plate_stability.py \
            tests/test_plate_orthotropic.py \
            tests/test_free_plate_modal.py \
            tests/test_guitar_plate.py \
            tests/test_vk_airy.py \
            tests/test_vk_bracket.py

      # Phase 2 batch 2's success condition. `body` is 203 lines and the smallest model in the
      # project; its client list is the longest of anything ported so far, and that asymmetry IS
      # the claim.
      #
      # * `test_body.py` is nine tests and establishes the physics in isolation.
      # * `connection` and `radiation` both do `from .body import ModalBody` at module scope, so
      #   the flag swings the string-on-a-body bridge, the sympathetic-string bank, the plate and
      #   free-plate bridges, the von Karman bridge, and all three radiation tiers.
      # * `radiation.RadiatedBody`, the rational air load and `airbox.RoomLoadedBody` each
      #   correct `q` after `step()` returns and then ASSIGN to `_accel`, once per timestep.
      #   Those writes are what decide whether the binding's buffer contract is right for a
      #   third, underscore-named state array, and no body test makes one.
      - name: The modal body and its clients, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_body.py \
            tests/test_connection.py \
            tests/test_radiation.py \
            tests/test_sympathetic.py \
            tests/test_airbox_port.py \
            tests/test_airbox_modal.py \
            tests/test_airbox_scene.py \
            tests/test_plate_connection.py \
            tests/test_free_plate_connection.py \
            tests/test_vk_connection.py

      # Phase 2 batch 3's success condition, and the batch is the wind leg entire: the air column
      # and the reed that blows it, ported together because the EXCITER SEAM between them was the
      # thing that had to be decided (plan §12.5).
      #
      # `test_reed_signature.py` is in this list and that is not padding. The reed's step ordering
      # -- open-end pin, then the source hook, then the radiating drain, then momentum -- is
      # load-bearing and NO energy test can see it: get it wrong and the reed still oscillates and
      # the books still roughly balance. The project's own reed work established that balance is
      # not a sufficient detector there and the signature is, so the signature runs here.
      #
      # `test_bore_radiation.py` and `web/serialize.py` also read `_open_left`/`_open_right`, and
      # `reed.py` reads `_bc_left` -- three more private names that are part of the surface, for
      # the same reason `_accel` was (plan §12.2).
      - name: The bore, the reed and their tests, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_bore_energy.py \
            tests/test_bore_modal.py \
            tests/test_bore_radiation.py \
            tests/test_bore_stability.py \
            tests/test_reed_energy.py \
            tests/test_reed_signature.py \
            tests/test_reed_stability.py

      # Phase 2 batch 4's success condition -- the air node, and the first batch whose claim is
      # NOT bit-identity.
      #
      # `radiation.RadiatedBody.step` reads `np.dot(b.a, b.q - q_nm1)` and feeds that number into
      # the next state rather than reading it out, so OpenBLAS's fused multiply-add reaches the
      # trajectory. Which kernel OpenBLAS picks is a property of the runner's CPU, so the bar is
      # the plan's Group A target and not zero (plan section 14).
      #
      # The subtlety that decides what this step actually proves: every multi-mode body the suite
      # hands these classes uses `phi=1.0` and no `radiation` weight, so `a_i = 1`, every product
      # inside that `np.dot` is exact, and the fused and rounded forms are indistinguishable.
      # Under this flag the divergence is therefore exactly zero -- a real property of these
      # tests, not a measurement of the port. The measurement is in
      # `test_rust_parity_radiation.py`, which builds a body whose weights are NOT powers of two
      # on purpose. (Checked, not assumed: the largest ModalBody anywhere in the repo is five
      # modes, below OpenBLAS's 16-term vectorisation threshold -- above which the summation ORDER
      # diverges even when every product is exact.)
      #
      # `test_web_backend.py` is in the list because `web/serialize.py` hands a `RadiatedBody` to
      # `StringBodyBridge` as the body -- so the flag puts a Rust wrapper inside a Python bridge,
      # which is the `__getattr__` delegation surface and nothing in `tests/test_radiation.py`
      # exercises it. It costs this job ~13 minutes on its own, and that is deliberate: section
      # 13.7 measured that file by hand instead, and by-hand is not a gate.
      #
      # Four of the six files also appear in the batch-2 and batch-3 steps above. That redundancy
      # is the convention this job already follows -- each step's list is a CLAIM about one
      # batch's swap, not a partition of the suite.
      - name: The air node and its clients, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_radiation.py \
            tests/test_bore_radiation.py \
            tests/test_airbox_freefield.py \
            tests/test_airbox_scene.py \
            tests/test_connection.py \
            tests/test_web_backend.py

      # Phase 3 batch 1's success condition -- the shared banded Cholesky, and the FIRST swap in
      # this migration that deliberately changes the numbers.
      #
      # `physsynth/core/banded.py` is not a model. Four models factor a pentadiagonal SPD matrix
      # and back-substitute every step -- `string_stiff`, `string_damped`, `string_nonlinear`,
      # `string_geometric` -- and until this batch each imported the solver straight from SciPy.
      # They had to move together, not one at a time, because they are chained by BIT-IDENTITY
      # reduction anchors: sigma1 = 0 makes the damped string `array_equal` to the stiff one,
      # EA = 0 makes the tension-modulated string `array_equal` to the damped one, EA = T does the
      # same for the geometrically exact one. Port one model and those anchors become
      # cross-language comparisons that the banded solve cannot carry -- OpenBLAS's triangular band
      # kernel is blocked and no scalar transcription reproduces it (plan section 15).
      #
      # So the claim of this step is deliberately two-sided. The four models no longer agree with
      # LAPACK to the bit -- they agree to the plan's Group A target over a short run, and their
      # energy and modal bars are untouched, which is exactly the hand-off section 4 describes.
      # What they DO still do is agree with each OTHER exactly, and that is what the three anchor
      # tests inside this list check.
      #
      # The list is wide because `DampedStiffString` is the most-reused resonator in the project:
      # the bow, the barrier, the bridges and the sympathetic strings all vibrate one, so all of
      # them are now solving with Rust. `test_beam_*` is here for the opposite reason -- beam does
      # NOT use the banded solver, so it is the control that says a failure below is about this
      # batch rather than about the operators underneath it.
      - name: The banded solver's four models and their clients, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_stiff_string.py \
            tests/test_damped_string.py \
            tests/test_tension_string.py \
            tests/test_geometric_energy.py \
            tests/test_geometric_limits.py \
            tests/test_geometric_phantom.py \
            tests/test_geometric_polarization.py \
            tests/test_geometric_rotating_wave.py \
            tests/test_geometric_whirl.py \
            tests/test_bow_energy.py \
            tests/test_bow_modal.py \
            tests/test_bow_stability.py \
            tests/test_collision_energy.py \
            tests/test_collision_modal.py \
            tests/test_collision_signature.py \
            tests/test_jawari.py \
            tests/test_connection.py \
            tests/test_sympathetic.py \
            tests/test_beam_modal.py \
            tests/test_beam_stability.py

      # Phase 3 batch 2's success condition -- the contact leg, and the batch that finally makes
      # the mallet run on Rust arithmetic without the mallet itself having been ported.
      #
      # `physsynth/core/collision.py` holds the contact primitives and BOTH contact solves: the
      # scalar one the mallet uses and the vector one the barrier string uses. `mallet.py`
      # re-exports the five primitives and calls the scalar solve, so this one swap swings two
      # models. `BarrierString` and `MalletMembrane` themselves were still Python when this step
      # was written -- they wrap a `DampedStiffString` and a `Membrane`, and a model is not ported
      # ahead of what it is built from (plan section 16).
      #
      # BOTH OF THOSE SHELLS HAVE SINCE PORTED (the mallet in section 17, the barrier in section
      # 23), so the four files below no longer exercise a Python model over a Rust solve -- they
      # exercise a Rust model. The step is kept because its CLAIM is still worth making and still
      # true; the sentence above is corrected rather than deleted because a step whose meaning
      # changed under it is exactly what section 20.11 caught in the prose, and leaving the
      # original wording would repeat that.
      #
      # The claim was two-sided in a different way from the banded one above. The SCALAR half
      # contains no reduction anywhere and is bit-identical, brentq bracket fallback included --
      # that half is now asserted by the mallet's own step further down. The VECTOR half is driven
      # by `G @ F(eta)`, a dense BLAS matvec feeding back into the next Newton iterate, which is
      # section 14.2's construction -- so the barrier files below are a Group A claim.
      #
      # And the barrier's default fixture cannot see the difference, which is worth stating here
      # rather than leaving as a pleasant surprise: its Newton Jacobian is within 1e-2 of the
      # identity, so the new dense LU is effectively a no-op and 79 nodes in contact still come out
      # bit-identical. That is not evidence the solvers agree, it is evidence the solver was barely
      # used -- the fixture that actually exercises it lives in `test_rust_parity_collision.py`,
      # which is why that file is not optional coverage for this batch (plan section 16.4).
      #
      # The mallet's three files moved to their own step when the mallet itself was ported one
      # batch later (section 17); what is left here is the barrier, which is what this batch
      # was about. The two steps are kept apart on purpose -- a batch's success condition
      # should stay readable as the thing that batch claimed, not accrete its successors.
      - name: The barrier string and its buzzing bridge, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_collision_energy.py \
            tests/test_collision_modal.py \
            tests/test_collision_signature.py \
            tests/test_jawari.py

      # PHASE 2'S LAST BATCH, and therefore the end of Phase 2 (plan section 17). The mallet's
      # two model shells are now Rust as well: `MalletMembrane`, which holds the caller's own
      # Rust `Membrane` and corrects one node of it per step, and `MalletWall`, the standalone
      # rig where model #7's closed-form oracle lives.
      #
      # Section 16.11 pre-declared that any divergence here would be the shell's, since the
      # drumhead and the contact solve had both already been ported. It is not: measured
      # 2026-08-27, the whole trajectory -- mallet position, penetration, force, contact flag,
      # fallback count and the drumhead's ENTIRE field -- is bit-identical over 2,000 steps
      # across seven fixtures. `MalletWall` is bit-identical in every observable INCLUDING its
      # energy, and that is what makes the attribution: the coupled model's `energy()` is the
      # single exception, at 2e-16, and it differs because `Membrane.energy()` is a REDUCTION
      # (section 14.2) rather than because anything in this batch moved.
      #
      # The one thing a shell this small could get wrong is `** 2`. Both admittances are built
      # from one -- `k**2 / (rho h**2 (1 + sigma k))` and `k**2 / M` -- and on Python floats
      # `**` is the C library's `pow`, NOT `x * x`. They are different doubles, they multiply
      # the contact force at every timestep, and getting it wrong would conserve energy
      # perfectly, so no physics bar in this repo could have caught it.
      #
      # The swap guard itself -- which this batch gave `collision` and `mallet` entries in --
      # is NOT re-listed here: `tests/test_stability.py` already runs under the flag in the
      # first step of this job, and once is enough.
      - name: The mallet's two models, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_mallet_energy.py \
            tests/test_mallet_signature.py \
            tests/test_mallet_wall.py \
            tests/test_membrane_energy.py

      # Phase 3 batch 3's success condition -- the first two MODELS out of the four-string chain.
      #
      # `string_stiff.py` and `string_damped.py` are now Rust, and this step is wide for the same
      # reason the banded one above is: `DampedStiffString` is the most-reused resonator in the
      # project, so a Rust string is now under the bow, under the fret barrier, under the sitar
      # bridge, under every sympathetic-string rig and under the body/plate bridges. Those clients
      # are all still Python, which is the ordinary shape of a migration (plan section 1.2) -- and
      # it is precisely why they are listed: this step is where a Python client that reached for
      # something the binding does not expose would fail.
      #
      # WHAT HAD TO MOVE FIRST, AND IT IS NOT IN RUST. Two evaluation orders were pushed to a
      # spelling both languages can express, unconditionally, in `physsynth/core/portable.py`:
      #
      #   * the energy REDUCTION -- `np.dot` is BLAS `ddot`, which is not a left-to-right sum and
      #     differs from one in ~84% of the vectors this family uses;
      #   * the operator's COLUMN ORDER -- SciPy's SMMP kernel returns the biharmonic block with
      #     DESCENDING indices, and a CSR matvec sums each row in stored order, so `L @ u` differs
      #     between the two spellings in 2000 of 2000 random vectors. That one is on the UPDATE
      #     path, so it is a different trajectory rather than a different reported number.
      #
      # Both edits apply to ALL FOUR theta-scheme strings at once, because the suite chains them
      # with bit-identity anchors across model classes -- the same reason the solver was ported
      # before any of its callers one batch ago. `test_tension_string.py` and the
      # `test_geometric_*` files are here as the anchors' other end: they are still Python, and
      # they must still be `array_equal` to a Rust string.
      #
      # The claim: under the flag -- where both sides also share the Rust banded solver -- the two
      # implementations agree to the BIT in every observable including `energy()`, over 2,000 steps
      # and over 20,000. Without the flag they do not, and that gap is section 15.3's solver, not
      # this port; `test_rust_parity_strings.py` separates the two causes by holding the solver
      # fixed, which is why it is not optional coverage for this batch.
      - name: The two theta-scheme strings and their clients, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_stiff_string.py \
            tests/test_damped_string.py \
            tests/test_tension_string.py \
            tests/test_geometric_energy.py \
            tests/test_geometric_limits.py \
            tests/test_bow_energy.py \
            tests/test_bow_stability.py \
            tests/test_collision_energy.py \
            tests/test_jawari.py \
            tests/test_connection.py \
            tests/test_sympathetic.py \
            tests/test_free_plate_connection.py \
            tests/test_beam_modal.py

      # Phase 3 batch 4's success condition -- the tension-modulated string, model #9, and the
      # first model in the project whose UPDATE MATRIX MOVES EVERY STEP. The banded factor is
      # inside a scalar root-find rather than at construction, so `banded` and `root` meet here for
      # the first time.
      #
      # `test_tension_string.py` carries the model's own bars, the `EA = 0` anchor -- now between a
      # Rust model #9 and a Rust model #3 -- and the parametric-instability signature test, which
      # is the one a last-bit perturbation could plausibly move.
      #
      # `test_web_backend.py` is here because `web/serialize.py` builds a `TensionModulatedString`
      # for its `tension` model, so the viewer is this port's only other client (plan section 1.1)
      # and the flag now puts a Rust string under it.
      #
      # NOT re-listed: the geometric string's files. Their flagged configuration did NOT move this
      # batch -- `string_geometric` does not import `string_nonlinear`, and the two evaluation
      # orders the family shares were already in place. Section 18.8's rule is to re-run every step
      # whose configuration CHANGED, which is not the same as re-running everything nearby.
      - name: The tension-modulated string and the viewer, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_tension_string.py \
            tests/test_damped_string.py \
            tests/test_web_backend.py

      # Phase 3 batch 5's success condition, and the END OF PHASE 3 -- the bowed string, the
      # project's first continuous nonlinear EXCITER and the last model of the phase.
      #
      # `bow.py` holds a `DampedStiffString` and corrects one node of it per step through a
      # precomputed driving-point admittance, so almost everything hard about it was ported before
      # this batch: the banded solve in batch 1, the string in batch 3, the Brent fallback in Phase
      # 2 batch 3, the scan-and-bracket idiom in batch 2. What is new is one line of arithmetic and
      # one question.
      #
      # THE ARITHMETIC. The friction residual is spelled TWICE in the original and the two
      # spellings are different doubles: `_residual` multiplies by `g` last, `_bracketed_root`
      # hoists `g * force * sqrt(2a)` into one scalar so NumPy can apply it to the whole scan array.
      # Measured 2026-08-27, they disagree in 306 of 20,000 samples from this model's range. The
      # port carries both, because the scan's values decide WHICH BRACKETS EXIST -- one flipped
      # sign is one `brentq` call that does not happen, and at a slip event that is a different
      # branch. Both `tests/test_rust_parity_bow.py` and `crates/physsynth-core/tests/bow.rs` pin
      # that they stay apart; nothing else in either suite could notice them being merged.
      #
      # THE QUESTION was section 19.11's: a Newton ITERATION COUNT and a fallback BRANCH are
      # compared by nothing in this repo, and the tension string's batch showed a last bit reaching
      # one (a different count on 1,400 of 5,000 steps). Answered here rather than assumed --
      # `test_rust_parity_bow.py` compares both step for step. Under a shared solver they are
      # identical; with independent solvers the branch never differs and the count differs at most
      # once in 20,000 steps, because the perturbation is ~1e-14 relative against a Newton
      # tolerance that is 1e-13 absolute in velocity units of order 0.1.
      #
      # `test_web_backend.py` is here because `web/serialize.py` builds a `BowedString` for its
      # `bow` model, so the viewer is this port's only other client (plan section 1.1).
      - name: The bowed string and the viewer, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_bow_energy.py \
            tests/test_bow_modal.py \
            tests/test_bow_stability.py \
            tests/test_damped_string.py \
            tests/test_web_backend.py

      # Phase 3 batch 6's success condition, and the ACTUAL END OF PHASE 3 -- the distributed
      # barrier, model #8. The previous step called itself the end of the phase and was wrong:
      # `collision.BarrierString` had been described in batch 2 as waiting on its host
      # `DampedStiffString`, that host landed in batch 3, and the sentence was never revisited
      # (plan section 20.11). This step is what finishes the phase.
      #
      # Almost nothing here is new machinery -- the contact primitives, the vector solve and the
      # dense LU all landed in batch 2, the string in batch 3, the banded solve in batch 1. What is
      # new is the SHELL: construction (broadcast the profile, pick the support, solve `m`
      # admittance columns), the two penetration gathers, the rank-`m` force injection, and the
      # barrier's two-time-averaged potential energy.
      #
      # THE ARITHMETIC, and it is one line. `force_pref = string.k ** 2 / string.rho` is
      # `float.__pow__`, i.e. the C library's `pow` -- NOT `k * k`, which is a different double for
      # a small fraction of sample rates. `bow.py` writes `self.k * self.k` at the same spot, so the
      # two models' ports must spell their prefactor differently to stay faithful to their own
      # originals. Both suites pin it, and both go and FIND a witness sample rate at runtime rather
      # than hardcoding one, because which arguments `pow` rounds differently is a property of the
      # runner (plan section 22.1) and a hardcoded witness would be a bar decided by the machine.
      #
      # THE SECOND MATVEC. Injecting the force is `u[1:-1] += force_pref * (cols_mat @ f)`, a dense
      # BLAS matvec on the update path that nothing compared across the languages until the model
      # itself ported. At two contact nodes it differs in 1,291 of 158,000 rows and the trajectory
      # stays bit-identical -- because a TWO-term sum can only be reordered into a different double
      # if its terms cancel, and a cancelled correction is 9.3e-13 of the field, far below its last
      # bit. At 79 terms that correlation is gone and 7 differences in 2,000 steps reach the state.
      # So the exactness at two nodes is a claim about the LENGTH OF THE SUM, and
      # `tests/test_rust_parity_collision.py` asserts both halves.
      #
      # `test_web_backend.py` is here because `web/serialize.py` builds a `BarrierString` for THREE
      # of its models -- the jawari bridge, the juari thread and the fret rail -- so the viewer is
      # this port's largest client (plan section 1.1).
      #
      # The four barrier files overlap with batch 2's step above, and that is deliberate rather
      # than an oversight: there they are a claim about the vector SOLVE with a Python shell over
      # it, here they are a claim about the shell. The overlap costs about fifteen seconds and
      # keeps each batch's success condition readable as the thing that batch claimed.
      #
      # `test_damped_string.py` is the third copy of that file in this job (batch 3's step and the
      # bow's both run it) and is here for the reason the bow's step gives: it is the CONTROL. If
      # this step goes red and that file is green in it, the failure is the barrier's shell; if
      # they go red together, it is the string underneath and belongs to section 18.
      - name: The distributed barrier and the viewer, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_collision_energy.py \
            tests/test_collision_modal.py \
            tests/test_collision_signature.py \
            tests/test_jawari.py \
            tests/test_damped_string.py \
            tests/test_web_backend.py

      # PHASE 4 -- `beam`, and the batch was sent to answer a question rather than to add a model.
      #
      # `beam` is the smallest member of the sparse-LU group (254 lines, one `splu`) and plan
      # section 4.1 chose it as the place to find out whether Rust could link SuperLU and hold that
      # whole group to the bit-identity Groups A-C get. It cannot. Of section 4.1's three named
      # obstacles, two are non-issues (COLAMD's order is a closed form in `n`; SciPy calls `gstrf`
      # rather than the driver, so equilibration never runs) and the third is real only above
      # N = 48, where the matrix stops being diagonally largest and SuperLU begins swapping rows.
      # What decides it is a fourth nobody listed: SuperLU is SUPERNODAL, and handed its own
      # factors a longhand triangular solve still disagrees with `lu.solve` in ~20% of entries at
      # ~4e-16 -- a property of how SciPy BUILT its copy, i.e. section 22.1 one layer down. Group D
      # therefore runs on the fallback section 4.1 already named: tolerance-level agreement.
      #
      # WHAT THE TOLERANCE IS, and it is the batch's finding. `K`'s nullspace is exactly `{1, x}`,
      # so along the rigid-body directions a free-free beam is a FREE PARTICLE and a per-step
      # solver difference is integrated twice: the rigid component grows like t^2 (3.7e-17 at one
      # step, 3.3e-9 of amplitude at 20,000) while the elastic component random-walks to ~1.4e-12
      # and the energy stays inside 7e-12. That is a sixth agreement regime and the first set by a
      # BOUNDARY CONDITION -- inherited by every free-edge model in Phases 5 and 6, which is why it
      # is written here and not only in the test.
      #
      # These four files are the unmodified Python beam tests. They pass because they assert the
      # PHYSICS -- the closed-form `cos(bL)cosh(bL) = 1` oracle through a generalized `eigsh` on
      # `K` and `W`, the energy identity, the rejections -- and none of that moves at 1e-9. The
      # comparison that the physics cannot make is in the parity step below.
      - name: The free-free beam, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_beam_energy.py \
            tests/test_beam_modal.py \
            tests/test_beam_stability.py \
            tests/test_stability.py

      # Phase 5 batch 1's success condition, and it is a different KIND of claim from every step
      # above it. What ported here is the guitar outline -- `guitar_mask` and the six functions
      # around it -- and its output is not a number, it is a SET OF NODES. `|x| < half(y)` with
      # `half` built from `sin` and `cos`, so section 22.1's finding (NumPy computes
      # transcendentals with its own CPU-dispatched routines, not the platform libm) lands
      # directly on a live/dead decision. A plate with one node too few conserves energy
      # beautifully, keeps a 3-dimensional nullspace and reports a plausible spectrum: every
      # detector in this repo passes it. So the mask is compared node for node in the parity step,
      # and these files are here to prove that a Rust-built outline drives the real models.
      #
      # Why the exact comparison is safe at all was measured before the port: over 130 shipped
      # configurations every REAL guitar clears its own rim by at least 1.9e7 ulps of `half`, so a
      # last bit cannot move a node. The degenerate lens (waist = 0, asym = 0) does not clear it --
      # four nodes sit ONE ulp out at N = 32 and two sit exactly on the rim -- which is why
      # `operators2d.py` now evaluates the profile through the scalar libm, where CPython and Rust
      # meet, and keeps NumPy's vectorised spelling only for the area quadrature (plan 25.3-25.5).
      - name: The plate family's outline, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_guitar_plate.py \
            tests/test_free_plate_energy.py \
            tests/test_free_plate_modal.py \
            tests/test_free_plate_orthotropic.py \
            tests/test_plate_energy.py \
            tests/test_plate_modal.py \
            tests/test_plate_orthotropic.py \
            tests/test_vk_free.py \
            tests/test_vk_energy.py \
            tests/test_membrane_modal.py \
            tests/test_stability.py

      - name: Record what decides the last bit
        # NumPy carries its own vectorised transcendentals, dispatched by CPU feature, while
        # the Rust port calls libm -- so which agreement claims below can hold is a property
        # of this machine. Two runs of identical code disagreed on 2026-08-27 (plan 22).
        # When one of them next goes red, this is the first thing to compare.
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          python -c "import numpy; numpy.show_runtime()"

      # The comparison the physics bars are too loose to make: state arrays bit-for-bit, energy to
      # the plan's Group A target, and the buffer-lifetime properties that no physics test can see.
      # Runs WITHOUT the flag -- it imports both implementations by name and needs neither swapped.
      #
      # The bare `import` first is not belt-and-braces. `test_rust_parity.py` opens with a
      # module-level `pytest.importorskip`, so a failed or missing install SKIPS the file and the
      # step exits 0 having asserted nothing at all -- the same shape as the empty-sum hazard the
      # `checks` job below documents. The skip is right for the shard run, where the extension is
      # genuinely absent; it is wrong here, where its absence is the failure.
      - name: Rust vs Python parity
        run: |
          python -c "import physsynth_rs; print(physsynth_rs.__file__)"
          # `-rP` prints the captured stdout of tests that PASSED. Several parity tests
          # measure a separation and report it rather than asserting a number that would
          # be a claim about the machine (plan 22.1); without this the reports are
          # discarded on exactly the runs where they are the news.
          pytest --durations=10 -rP \
            tests/test_rust_parity.py \
            tests/test_rust_parity_operators.py \
            tests/test_rust_parity_ops2d.py \
            tests/test_rust_parity_membrane.py \
            tests/test_rust_parity_body.py \
            tests/test_rust_parity_bore.py \
            tests/test_rust_parity_reed.py \
            tests/test_rust_parity_radiation.py \
            tests/test_rust_parity_banded.py \
            tests/test_rust_parity_collision.py \
            tests/test_rust_parity_mallet.py \
            tests/test_rust_parity_strings.py \
            tests/test_rust_parity_tension.py \
            tests/test_rust_parity_bow.py \
            tests/test_rust_parity_beam.py

  # Lint, plus the OUTER half of the shard guard.
  #
  # The inner half is `tests/test_shard_partition.py`, which asserts the split covers `tests/`
  # exactly once — but it cannot catch a split that dropped the file it lives in, because then it
  # does not run. So this job asks pytest itself, four times over, and does the arithmetic: the
  # shards' collected counts must sum to the whole suite's. That subtraction is the only thing that
  # can tell "everything ran, in pieces" apart from "a piece never ran and every job was green".
  checks:
    name: Lint + shard reconciliation
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      # Collection output is captured, never echoed: it is one line per test, and 4 x 1800 lines of
      # ids would bury the two numbers this job exists to print.
      #
      # `set -euo pipefail` is load-bearing, not boilerplate. Without `pipefail` the exit status of
      # `pytest | grep` is GREP's, so a collection error inside pytest is invisible here; and without
      # the emptiness check `sum=$((sum + ))` is a silent no-op rather than an error, so a shard that
      # half-collected could still reconcile. A guard that can pass quietly is the failure it exists
      # to catch, one level down.
      - name: Shard split covers the suite exactly once
        run: |
          set -euo pipefail
          count_collected() {
            pytest --collect-only "$@" | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+'
          }
          total=$(count_collected)
          test -n "$total"
          sum=0
          for i in $(seq 1 ${{ needs.setup.outputs.count }}); do
            files=$(python scripts/shard_tests.py --shard "$i" --of ${{ needs.setup.outputs.count }})
            n=$(count_collected $files)
            test -n "$n"
            echo "shard $i: $n tests"
            sum=$((sum + n))
          done
          echo "shards sum to $sum; whole suite collects $total"
          test "$sum" -eq "$total"
