name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    name: Validation harness (energy / modal / convergence / stability)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

      # `-n auto` = one worker per available core (GitHub runners are small, so this is ~4).
      # `--dist loadgroup` scatters tests freely EXCEPT where a module carries
      # `pytest.mark.xdist_group`, which keeps its expensive module-scoped fixtures on one worker.
      # conftest.py pins each worker to a single BLAS thread so the pool does not oversubscribe.
      - name: Run validation harness
        run: pytest -q -n auto --dist loadgroup
