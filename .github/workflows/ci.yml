name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly, 04:00 UTC — this is where the SECOND interpreter is covered (see the matrix below).
    - cron: "0 4 * * *"
  workflow_dispatch:

# Why the gate is SPLIT across machines (2026-08-17)
# --------------------------------------------------
# It used to be one job, and it took ~15 min. The standing explanation was that two `xdist_group`-
# pinned modules held ~470 s and ~300 s of un-parallelisable chain, so the wall was a bottleneck.
# Measured, that explanation is wrong: a 4-core runner offers ~3700 core-seconds across a 920 s
# wall and the suite genuinely uses ~80-85% of them. The longest chain is barely half the wall, and
# the rest of that worker was packed. This suite is BULK-bound, not bottleneck-bound.
#
# The confirming number was already on the record and had been read the other way round: the old
# fast lane deselected the entire expensive family — 69 of 1721 tests, every one of the chains —
# and still took 784 s against the full run's 922 s. Remove the bottleneck and you keep ~85% of the
# wall, which is what "the bulk is the cost" means.
#
# A bulk-bound suite has exactly one lever: more cores. On a public repo more cores are free, in
# units of one 4-core runner per job, so the suite is partitioned over N of them and the wall
# becomes (total core-seconds)/(4N) — until it meets the longest single chain inside a shard, which
# is where splitting the pins starts to matter and not before.
jobs:
  # The split's width lives in `scripts/shard_tests.py` as ONE Python constant, and this job is how
  # the workflow reads it instead of repeating it. Writing it in both places fails silently: a
  # matrix of [1, 2] against a split computed `--of 3` runs two thirds of the suite and goes green.
  setup:
    name: Plan the split
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      # No install, no `setup-python`: the script is stdlib-only precisely so this job is ~5 s.
      - id: plan
        run: |
          echo "shards=$(python3 scripts/shard_tests.py --matrix)" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 scripts/shard_tests.py --count)" >> "$GITHUB_OUTPUT"
          python3 scripts/shard_tests.py --list

  validate:
    name: Validation harness (py${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      # Do not cancel 3.12 because 3.11 went red, and do not cancel shard 2 because shard 1 went
      # red: when two of these disagree, the disagreement IS the finding, and cancelling the rest
      # hides which axis the split is on.
      fail-fast: false
      matrix:
        # Pushes and PRs pay for one interpreter and the nightly pays for both. This is pure-numeric
        # code whose failures have never once been interpreter-specific (the one real split in this
        # repo's history was Windows vs Linux, an axis the matrix does not even cover).
        # fromJSON is required: a matrix value must be an ARRAY, and the ternary yields a string.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.11","3.12"]' || '["3.12"]') }}
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # THE WHEEL IS INSTALLED HERE, and this job stopped being the pure-Python baseline on
      # 2026-09-03. That is a decision (the human's, plan 39.6 route 1), not a convenience: with
      # `physsynth/core/string_ideal.py` reduced to a re-export of `physsynth_rs`, there is no
      # pure-Python path left to run, and a job that skipped what it could not import would report
      # green while asserting nothing about the model. See plan 39.6 for the two rejected routes.
      #
      # What this job still is, and it is not nothing: the suite with NO flag set. Every model whose
      # Python body survives runs its Python implementation here and its Rust one in
      # `rust-harness`, so the pair of jobs still splits a physics regression from a port
      # regression. That distinction narrows by one model per deletion and ends when the last body
      # goes -- at which point these two jobs are the same run and one of them should be removed.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ./crates/physsynth-py

      # `-n auto` = one worker per available core (4 on a standard runner; `nproc` is echoed so the
      # divisor is on the record next to the numbers it divides).
      # `--dist loadgroup` scatters tests freely EXCEPT where a module carries
      # `pytest.mark.xdist_group`, which keeps its expensive module-scoped fixtures on one worker.
      # conftest.py pins each worker to a single BLAS thread so the pool does not oversubscribe.
      #
      # NO `-q` HERE. `pyproject.toml` already sets `addopts = "-q"`, so passing it again makes it
      # `-qq`, which suppresses the `N passed in …` summary entirely — a green run and a red run
      # then end the same way on screen. Verified both ways on 2026-08-10.
      #
      # `--durations=25` is free (it only reports what pytest already timed). Per SHARD it is also
      # the only way to see a shard going chain-bound: when one file's setup approaches the shard's
      # own wall, more runners stop buying anything and the fix moves inside that file.
      - name: Run validation harness (shard ${{ matrix.shard }}/${{ needs.setup.outputs.count }})
        run: |
          echo "cores: $(nproc)"
          files=$(python scripts/shard_tests.py --shard ${{ matrix.shard }} \
                    --of ${{ needs.setup.outputs.count }})
          pytest -n auto --dist loadgroup $files --durations=25

  # The Rust migration's gate (docs/dev/rust-migration-plan.md).
  #
  # A SEPARATE job, deliberately not a step inside the three shards. Those shards run the suite
  # with no flag set -- so every model that still HAS a Python body runs it there, and that is the
  # baseline a ported model is measured against. Keeping the two apart keeps the answer legible
  # when they disagree: a red shard is a physics regression, a red `rust` job is a port regression.
  #
  # The shards install the wheel as of 2026-09-03 (plan 39.6) because deleted models have no
  # Python left to run; they are no longer the "pure-Python core" run this comment used to
  # describe, and the count it quoted (1,808) was stale by 200 tests besides.
  #
  # Three things are checked, in increasing order of what they cost to discover:
  #   1. the crates compile, are formatted, and pass clippy;
  #   2. `cargo test` — the native physics bars, plus the Cargo dependency allowlist that is the
  #      Rust half of the portability contract (plan §2.2);
  #   3. the EXISTING Python tests, unmodified, run against the Rust model via `PHYSSYNTH_RS`.
  #      That third one is the migration's actual success condition. The first two only make its
  #      failures cheap to read.
  #
  # (3) is the `rust-harness` job below rather than a step here. It used to be TWENTY-ONE steps in
  # this job, one per batch, each naming by hand the files that batch's port could reach -- and
  # each of those lists was a *claim* at the time it was written: "these are the tests that touch
  # what I just ported, and they stay green with it underneath". With `physsynth/core/` finished
  # (plan §34) every one of those claims is subsumed by a single larger one -- the whole suite runs
  # green under the flag -- and twenty-one hand-maintained file lists are then twenty-one chances
  # to name a file that no longer exists while proving nothing the one run does not.
  #
  # Measured before the collapse, on 2026-09-03 and on this repo's dev box rather than a runner:
  # the whole suite minus the parity family, with `PHYSSYNTH_RS=1`, is 2,001 passed. That number is
  # what licenses the deletion. The union of the twenty-one subset lists was never the suite, so
  # until it was actually run, "the flagged suite is green" was an assumption and not a result.
  rust:
    name: Rust core (compile, native bars, parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PINNED, not `stable`. `clippy -- -D warnings` below turns every lint a new stable release
      # introduces into a red gate on an unrelated push, and this repo has already paid for unread
      # red runs twice. Bumping is a deliberate edit: change the version here, run
      # `cargo clippy --workspace --all-targets -- -D warnings` locally, fix what the new release
      # noticed, and land both together.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      # Rust compile times for a numeric crate are minutes and the cache is the difference between
      # tolerable and not (plan §7). Keyed on Cargo.lock, which is committed for exactly this kind
      # of reason -- a floating resolution would both miss the cache and move the numbers.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      # Runs `crates/physsynth-core/tests/` — the native energy/passivity/modal bars, and the
      # dependency allowlist. No interpreter involved, so a failure here is the physics or the
      # crate graph, never the binding.
      - name: Native validation + dependency allowlist
        run: |
          cargo test --workspace
          cargo test --workspace --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `physsynth` and `physsynth-rs` are two distributions on purpose (see
      # crates/physsynth-py/pyproject.toml): the pure-Python side stays installable on its own, so
      # the baseline it defines stays available. The wheel is abi3-py311, so this 3.12 job builds
      # and exercises the same binary a developer's 3.13/3.14 does.
      #
      # `pip install ./crates/physsynth-py` looks like it should not work -- the crate has a path
      # dependency on `../physsynth-core`, which is outside the directory being installed. It does:
      # pip builds a local directory IN TREE, so the relative path resolves and the compile lands
      # in the shared workspace `target/` that the cache step above restored. Verified 2026-08-26,
      # with and without build isolation. Do not "fix" this into a copy-out-and-build.
      - name: Install both sides
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ./crates/physsynth-py

      - name: Record what decides the last bit
        # NumPy carries its own vectorised transcendentals, dispatched by CPU feature, while
        # the Rust port calls libm -- so which agreement claims below can hold is a property
        # of this machine. Two runs of identical code disagreed on 2026-08-27 (plan 22).
        # When one of them next goes red, this is the first thing to compare.
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          python -c "import numpy; numpy.show_runtime()"

      # The comparison the physics bars are too loose to make: state arrays bit-for-bit and energy
      # to the plan's Group A target, for every model whose Python reference implementation still
      # exists. Runs WITHOUT the flag -- these files import both implementations by name and need
      # neither swapped.
      #
      # THIS LIST DRAINS. One entry goes with each deletion (plan section 39's units), and when the
      # last goes there is no two-sided comparison left to run anywhere. `test_binding_surface.py`
      # is first on purpose: it is not a comparison, it holds the properties of the BINDING that
      # neither a physics bar nor a native Rust bar can see (buffer lifetime, what `state` hands
      # out, PyO3's argument mapping), and it is the entry that never drains -- which is also what
      # keeps `tests/test_ci_workflow.py`'s asserted token count from reaching zero and going green
      # forever.
      #
      # The bare `import` first is not belt-and-braces. `test_rust_parity.py` opens with a
      # module-level `pytest.importorskip`, so a failed or missing install SKIPS the file and the
      # step exits 0 having asserted nothing at all -- the same shape as the empty-sum hazard the
      # `checks` job below documents. The skip is right for the shard run, where the extension is
      # genuinely absent; it is wrong here, where its absence is the failure.
      - name: Rust vs Python parity
        run: |
          python -c "import physsynth_rs; print(physsynth_rs.__file__)"
          # `-rP` prints the captured stdout of tests that PASSED. Several parity tests
          # measure a separation and report it rather than asserting a number that would
          # be a claim about the machine (plan 22.1); without this the reports are
          # discarded on exactly the runs where they are the news.
          pytest --durations=10 -rP \
            tests/test_binding_surface.py \
            tests/test_rust_parity.py \
            tests/test_rust_parity_operators.py \
            tests/test_rust_parity_ops2d.py \
            tests/test_rust_parity_banded.py \
            tests/test_rust_parity_beam.py \
            tests/test_rust_parity_plate.py \
            tests/test_rust_parity_airbox.py \
            tests/test_rust_parity_airbox_port.py \
            tests/test_rust_parity_airbox_wrap.py \
            tests/test_rust_parity_airbox_memb.py \
            tests/test_rust_parity_connection.py \
            tests/test_rust_parity_spectrum.py \
            tests/test_rust_parity_analysis.py \
            tests/test_rust_parity_rotating_wave.py

      # Phase 7's success condition, and the ONE step that survives the collapse above as
      # something other than the whole suite -- because it is not a per-batch file list. `analysis/`
      # reads its OWN flag, `PHYSSYNTH_RS_ANALYSIS`, for the reason
      # `physsynth/analysis/spectrum.py` gives at length: under `PHYSSYNTH_RS` alone the models are
      # Rust and the *instrument measuring them* is still Python, which is exactly what makes the
      # three-shard harness job worth anything. Setting both is the only run in which a Rust
      # detector measures a Rust model, so it is the only place this port meets its real clients.
      #
      # The file list is DERIVED, not typed. Twenty-one hand-written lists were deleted one commit
      # ago and reintroducing one here would be the same mistake in a smaller font; `grep -l` asks
      # the question those lists were trying to answer -- which test files reach the detector --
      # and cannot go stale as files are added. The parity family is filtered out for the usual
      # reason (it builds both sides itself and must run unflagged), and the count is echoed and
      # floored, because a grep that stopped matching would run nothing and exit 0.
      #
      # No line continuation anywhere in this block, deliberately. The first draft used one to wrap
      # the pipeline and it arrived here with the backslash AND the newline swallowed -- §24's
      # failure, caught by `tests/test_ci_workflow.py` rather than by review, six occurrences in.
      # Short lines cannot have that bug.
      #
      # Widened TWICE in Phase 7 batch 2, and the second widening is the one worth reading.
      #
      # Batch 1 grepped for `measure_partials_near|detect_peaks|magnitude_spectrum` because
      # `spectrum.py` was the only ported module. With `modal`, `damping`, `dispersion` and
      # `duffing` behind the same flag the question became "which test files read the instrument",
      # and the obvious answer -- the ones importing `physsynth.analysis` -- is WRONG BY 43 FILES.
      # `tests/helpers.py` does `from physsynth.analysis import modal, spectrum` and then measures
      # on its callers' behalf, so a file can be a heavy client of the instrument while never
      # naming it. `test_radiation.py` is one, and it carries the only check in the suite that
      # holds the ported Bessel J1 against `scipy.special.j1`.
      #
      # A derived list is only as honest as the reachability it models, and one hop of indirection
      # was enough to make it dishonest: 27 files matched, 65 actually reach. That is exactly the
      # shape §36.7 warned about -- a step that stays green while covering less than it claims --
      # arriving one batch later through a different door.
      - name: The instrument's clients, unmodified, against a Rust instrument
        env:
          PHYSSYNTH_RS: "1"
          PHYSSYNTH_RS_ANALYSIS: "1"
        run: |
          set -euo pipefail
          pat='physsynth\.analysis|import helpers|from helpers'
          files=$(grep -lE "$pat" tests/test_*.py | grep -v test_rust_parity || true)
          test -n "$files"
          n=$(echo $files | wc -w)
          echo "files reaching the instrument: $n"
          test "$n" -ge 60
          pytest -n auto --dist loadgroup $files --durations=10

  # The migration's success condition, as one claim instead of twenty-one (plan §35.7).
  #
  # The whole validation suite, unmodified, with `PHYSSYNTH_RS=1` -- so every ported model, solver,
  # operator, room, port, wrapper and bridge is exercised through its real clients rather than
  # through a hand-picked list of the files someone thought it could reach. Not one line of
  # `tests/` mentions Rust; the substitution happens inside `physsynth/core/*.py`, gated on this
  # variable, which is what makes running the suite unmodified mean anything at all.
  #
  # THE PARITY FAMILY IS EXCLUDED, and that is not an optimisation. `test_rust_parity_*.py` build
  # BOTH sides themselves and assert something about the pair; with the flag set, the side they
  # take to be Python is Rust too, so the file compares Rust against Rust. Most assertions then
  # pass vacuously and at least one -- a negative control, which asserts that a difference *exists*
  # -- fails outright. Neither is information. They run once, unflagged, in the `rust` job above.
  # `scripts/shard_tests.py --exclude-parity` owns the removal, and it removes them AFTER the
  # split so these shards are provably the `validate` job's shards minus a known list; see that
  # script's `PARITY_PREFIX` and `tests/test_shard_partition.py` for why the order is the hazard.
  #
  # Sharded over the same three runners as `validate`, for the same reason: the suite is
  # bulk-bound, so the only lever is cores. The cost stated plainly -- three matrix jobs each build
  # the wheel, so the Rust compile is paid three times, in parallel. That is the trade this file
  # already makes everywhere else (one runner per job is free on a public repo, wall clock is not).
  rust-harness:
    name: The suite, unmodified, against Rust (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      # Same reasoning as `validate`: when two shards disagree, the disagreement is the finding.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install both sides
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ./crates/physsynth-py

      # The import is checked before the suite runs, and it is load-bearing. Every `physsynth/core`
      # module reads `PHYSSYNTH_RS` at import and swaps in `physsynth_rs` when it is set -- but a
      # failed wheel install would make that import raise inside a module the suite imports, which
      # reports as a collection error rather than as "the extension is missing". Asking here means
      # the answer is one line at the top of the log instead of 2,000 identical tracebacks.
      - name: Record what decides the last bit
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          python -c "import physsynth_rs; print(physsynth_rs.__file__)"
          python -c "import numpy; numpy.show_runtime()"

      # The collected count is echoed for the same reason the `checks` job echoes its own: a shard
      # that collected nothing runs nothing and exits 0, and the number is the only thing that
      # tells that apart from a shard that passed.
      - name: Run the suite against Rust (shard ${{ matrix.shard }}/${{ needs.setup.outputs.count }})
        env:
          PHYSSYNTH_RS: "1"
        run: |
          set -euo pipefail
          echo "cores: $(nproc)"
          files=$(python scripts/shard_tests.py --shard ${{ matrix.shard }} \
                    --of ${{ needs.setup.outputs.count }} --exclude-parity)
          test -n "$files"
          echo "files in this flagged shard: $(echo $files | wc -w)"
          pytest -n auto --dist loadgroup $files --durations=25

  # Lint, plus the OUTER half of the shard guard.
  #
  # The inner half is `tests/test_shard_partition.py`, which asserts the split covers `tests/`
  # exactly once — but it cannot catch a split that dropped the file it lives in, because then it
  # does not run. So this job asks pytest itself, four times over, and does the arithmetic: the
  # shards' collected counts must sum to the whole suite's. That subtraction is the only thing that
  # can tell "everything ran, in pieces" apart from "a piece never ran and every job was green".
  checks:
    name: Lint + shard reconciliation
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      # THIS JOB PAYS A RUST COMPILE, and it did not before 2026-09-03. It has to: the
      # reconciliation step below runs `pytest --collect-only` over the whole suite, and a deleted
      # model's module is now an unconditional `from physsynth_rs import X` at module scope (plan
      # section 39.6, route 1). Without the extension that is a COLLECTION ERROR, not a skip -- so
      # every count this job subtracts would be wrong, or missing, and the guard that exists to
      # catch "a piece never ran" would itself never run. The lint half needs none of this; the
      # arithmetic half cannot do without it.
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ./crates/physsynth-py
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      # Collection output is captured, never echoed: it is one line per test, and 4 x 1800 lines of
      # ids would bury the two numbers this job exists to print.
      #
      # `set -euo pipefail` is load-bearing, not boilerplate. Without `pipefail` the exit status of
      # `pytest | grep` is GREP's, so a collection error inside pytest is invisible here; and without
      # the emptiness check `sum=$((sum + ))` is a silent no-op rather than an error, so a shard that
      # half-collected could still reconcile. A guard that can pass quietly is the failure it exists
      # to catch, one level down.
      - name: Shard split covers the suite exactly once
        run: |
          set -euo pipefail
          count_collected() {
            pytest --collect-only "$@" | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+'
          }
          total=$(count_collected)
          test -n "$total"
          sum=0
          for i in $(seq 1 ${{ needs.setup.outputs.count }}); do
            files=$(python scripts/shard_tests.py --shard "$i" --of ${{ needs.setup.outputs.count }})
            n=$(count_collected $files)
            test -n "$n"
            echo "shard $i: $n tests"
            sum=$((sum + n))
          done
          echo "shards sum to $sum; whole suite collects $total"
          test "$sum" -eq "$total"
