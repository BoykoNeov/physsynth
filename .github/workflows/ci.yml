name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly, 04:00 UTC — this is where the SECOND interpreter is covered (see the matrix below).
    - cron: "0 4 * * *"
  workflow_dispatch:

# Why the gate is SPLIT across machines (2026-08-17)
# --------------------------------------------------
# It used to be one job, and it took ~15 min. The standing explanation was that two `xdist_group`-
# pinned modules held ~470 s and ~300 s of un-parallelisable chain, so the wall was a bottleneck.
# Measured, that explanation is wrong: a 4-core runner offers ~3700 core-seconds across a 920 s
# wall and the suite genuinely uses ~80-85% of them. The longest chain is barely half the wall, and
# the rest of that worker was packed. This suite is BULK-bound, not bottleneck-bound.
#
# The confirming number was already on the record and had been read the other way round: the old
# fast lane deselected the entire expensive family — 69 of 1721 tests, every one of the chains —
# and still took 784 s against the full run's 922 s. Remove the bottleneck and you keep ~85% of the
# wall, which is what "the bulk is the cost" means.
#
# A bulk-bound suite has exactly one lever: more cores. On a public repo more cores are free, in
# units of one 4-core runner per job, so the suite is partitioned over N of them and the wall
# becomes (total core-seconds)/(4N) — until it meets the longest single chain inside a shard, which
# is where splitting the pins starts to matter and not before.
jobs:
  # The split's width lives in `scripts/shard_tests.py` as ONE Python constant, and this job is how
  # the workflow reads it instead of repeating it. Writing it in both places fails silently: a
  # matrix of [1, 2] against a split computed `--of 3` runs two thirds of the suite and goes green.
  setup:
    name: Plan the split
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      # No install, no `setup-python`: the script is stdlib-only precisely so this job is ~5 s.
      - id: plan
        run: |
          echo "shards=$(python3 scripts/shard_tests.py --matrix)" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 scripts/shard_tests.py --count)" >> "$GITHUB_OUTPUT"
          python3 scripts/shard_tests.py --list

  validate:
    name: Validation harness (py${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      # Do not cancel 3.12 because 3.11 went red, and do not cancel shard 2 because shard 1 went
      # red: when two of these disagree, the disagreement IS the finding, and cancelling the rest
      # hides which axis the split is on.
      fail-fast: false
      matrix:
        # Pushes and PRs pay for one interpreter and the nightly pays for both. This is pure-numeric
        # code whose failures have never once been interpreter-specific (the one real split in this
        # repo's history was Windows vs Linux, an axis the matrix does not even cover).
        # fromJSON is required: a matrix value must be an ARRAY, and the ternary yields a string.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.11","3.12"]' || '["3.12"]') }}
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `-n auto` = one worker per available core (4 on a standard runner; `nproc` is echoed so the
      # divisor is on the record next to the numbers it divides).
      # `--dist loadgroup` scatters tests freely EXCEPT where a module carries
      # `pytest.mark.xdist_group`, which keeps its expensive module-scoped fixtures on one worker.
      # conftest.py pins each worker to a single BLAS thread so the pool does not oversubscribe.
      #
      # NO `-q` HERE. `pyproject.toml` already sets `addopts = "-q"`, so passing it again makes it
      # `-qq`, which suppresses the `N passed in …` summary entirely — a green run and a red run
      # then end the same way on screen. Verified both ways on 2026-08-10.
      #
      # `--durations=25` is free (it only reports what pytest already timed). Per SHARD it is also
      # the only way to see a shard going chain-bound: when one file's setup approaches the shard's
      # own wall, more runners stop buying anything and the fix moves inside that file.
      - name: Run validation harness (shard ${{ matrix.shard }}/${{ needs.setup.outputs.count }})
        run: |
          echo "cores: $(nproc)"
          files=$(python scripts/shard_tests.py --shard ${{ matrix.shard }} \
                    --of ${{ needs.setup.outputs.count }})
          pytest -n auto --dist loadgroup $files --durations=25

  # The Rust migration's gate (docs/dev/rust-migration-plan.md).
  #
  # A SEPARATE job, deliberately not a step inside the three shards. Those shards install the
  # project with `pip install -e ".[dev]"` and run 1,808 tests against the pure-Python core; that
  # run is the baseline every ported model is measured against, and it must not grow a Rust
  # compile. Keeping the two apart also keeps the answer legible when they disagree: a red shard
  # is a physics regression, a red `rust` job is a port regression.
  #
  # Three things are checked here, in increasing order of what they cost to discover:
  #   1. the crates compile, are formatted, and pass clippy;
  #   2. `cargo test` — the native physics bars, plus the Cargo dependency allowlist that is the
  #      Rust half of the portability contract (plan §2.2);
  #   3. the EXISTING Python tests, unmodified, run against the Rust model via `PHYSSYNTH_RS`.
  #      That third one is the phase's actual success condition. The first two only make its
  #      failures cheap to read.
  rust:
    name: Rust core (compile, native bars, Python harness against it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PINNED, not `stable`. `clippy -- -D warnings` below turns every lint a new stable release
      # introduces into a red gate on an unrelated push, and this repo has already paid for unread
      # red runs twice. Bumping is a deliberate edit: change the version here, run
      # `cargo clippy --workspace --all-targets -- -D warnings` locally, fix what the new release
      # noticed, and land both together.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      # Rust compile times for a numeric crate are minutes and the cache is the difference between
      # tolerable and not (plan §7). Keyed on Cargo.lock, which is committed for exactly this kind
      # of reason -- a floating resolution would both miss the cache and move the numbers.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      # Runs `crates/physsynth-core/tests/` — the native energy/passivity/modal bars, and the
      # dependency allowlist. No interpreter involved, so a failure here is the physics or the
      # crate graph, never the binding.
      - name: Native validation + dependency allowlist
        run: cargo test --workspace --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `physsynth` and `physsynth-rs` are two distributions on purpose (see
      # crates/physsynth-py/pyproject.toml): the pure-Python side stays installable on its own, so
      # the baseline it defines stays available. The wheel is abi3-py311, so this 3.12 job builds
      # and exercises the same binary a developer's 3.13/3.14 does.
      #
      # `pip install ./crates/physsynth-py` looks like it should not work -- the crate has a path
      # dependency on `../physsynth-core`, which is outside the directory being installed. It does:
      # pip builds a local directory IN TREE, so the relative path resolves and the compile lands
      # in the shared workspace `target/` that the cache step above restored. Verified 2026-08-26,
      # with and without build isolation. Do not "fix" this into a copy-out-and-build.
      - name: Install both sides
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ./crates/physsynth-py

      # Phase 0's success condition, stated as the plan states it: not "a string works" but *the
      # existing tests passing unmodified against Rust*. Not one line of `tests/` mentions Rust --
      # the substitution happens inside `physsynth/core/string_ideal.py`, gated on this variable.
      #
      # The file list is spelled out because it is a CLAIM, not a partition: these are the files
      # that exercise `IdealString` directly, and the claim is that all of them stay green with the
      # Rust model underneath. It is not the shard machinery and must not be confused for it --
      # `scripts/shard_tests.py` still owns covering the suite, over in the `validate` job.
      - name: The ideal string's own tests, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_energy.py \
            tests/test_modal.py \
            tests/test_convergence.py \
            tests/test_dispersion.py \
            tests/test_stability.py

      # Phase 1's success condition, and it is a WIDER claim than Phase 0's for a structural
      # reason: `operators` is not a model, it is what five models are built out of. Flipping
      # PHYSSYNTH_RS swings `string_stiff`, `string_damped`, `string_nonlinear`,
      # `string_geometric` and `beam` onto Rust-built matrices while all five are still Python --
      # the plan's §1.2 lever, doing what it is for.
      #
      # So this list is not "the operator tests". `tests/test_operators.py` is four tests and
      # touches none of `delta_xxxx`, `second_difference_matrix`, `biharmonic_matrix` or
      # `free_beam_stiffness` -- naming it alone would be the vacuously-green trap the plan's §5
      # correction warns about, one phase later. The files below are the ones that actually reach
      # the ported code, directly or through a model built on it. The whole-suite run is the real
      # bar and is measured in the plan's §10; this step exists to make a failure cheap to read.
      - name: The operators' clients, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_operators.py \
            tests/test_stiff_string.py \
            tests/test_damped_string.py \
            tests/test_tension_string.py \
            tests/test_geometric_energy.py \
            tests/test_beam_modal.py \
            tests/test_beam_stability.py \
            tests/test_bow_stability.py \
            tests/test_free_plate_modal.py \
            tests/test_free_plate_orthotropic.py

      # Phase 2's success condition. Two claims in one step, because the swap makes them
      # inseparable: `membrane` is a model with clients of its own, and `operators2d`'s builder
      # half is what the WHOLE plate family assembles its geometry from.
      #
      # * The membrane's own bars are in four files (energy, modal, dispersion, stability) -- the
      #   by-criterion layout the plan's §5 correction describes, not a file named after the model.
      # * `mallet` and `airbox` each hold a Membrane and drive it: the mallet strikes one, and
      #   `airbox._MembraneSurface` reaches into `.u`, `.u_prev`, `.n` and `.L` directly, once per
      #   timestep. Those are the calls that decide whether the binding's buffer contract is right,
      #   and no membrane test can see them.
      # * `plate.py` imports `rectangle_mask`, `disk_mask`, `laplacian_from_mask` and `embed` from
      #   `operators2d`, so flipping the flag puts every plate -- supported, free, orthotropic,
      #   guitar-shaped -- and the von Karman bracket on Rust-built geometry while all of them are
      #   still Python models. Same lever as Phase 1's, one dimension up.
      #
      # `exciter` gets no list of its own on purpose: nearly every model's tests call
      # `triangular_pluck` or a raised cosine, so a list would be the suite. The whole-suite run
      # under the flag is the real bar and is measured in the plan's §11.
      - name: The membrane, its clients and the 2-D builders, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_membrane_energy.py \
            tests/test_membrane_modal.py \
            tests/test_membrane_dispersion.py \
            tests/test_membrane_stability.py \
            tests/test_mallet_energy.py \
            tests/test_mallet_signature.py \
            tests/test_mallet_wall.py \
            tests/test_airbox_membrane.py \
            tests/test_airbox_surface.py \
            tests/test_plate_modal.py \
            tests/test_plate_stability.py \
            tests/test_plate_orthotropic.py \
            tests/test_free_plate_modal.py \
            tests/test_guitar_plate.py \
            tests/test_vk_airy.py \
            tests/test_vk_bracket.py

      # Phase 2 batch 2's success condition. `body` is 203 lines and the smallest model in the
      # project; its client list is the longest of anything ported so far, and that asymmetry IS
      # the claim.
      #
      # * `test_body.py` is nine tests and establishes the physics in isolation.
      # * `connection` and `radiation` both do `from .body import ModalBody` at module scope, so
      #   the flag swings the string-on-a-body bridge, the sympathetic-string bank, the plate and
      #   free-plate bridges, the von Karman bridge, and all three radiation tiers.
      # * `radiation.RadiatedBody`, the rational air load and `airbox.RoomLoadedBody` each
      #   correct `q` after `step()` returns and then ASSIGN to `_accel`, once per timestep.
      #   Those writes are what decide whether the binding's buffer contract is right for a
      #   third, underscore-named state array, and no body test makes one.
      - name: The modal body and its clients, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_body.py \
            tests/test_connection.py \
            tests/test_radiation.py \
            tests/test_sympathetic.py \
            tests/test_airbox_port.py \
            tests/test_airbox_modal.py \
            tests/test_airbox_scene.py \
            tests/test_plate_connection.py \
            tests/test_free_plate_connection.py \
            tests/test_vk_connection.py

      # Phase 2 batch 3's success condition, and the batch is the wind leg entire: the air column
      # and the reed that blows it, ported together because the EXCITER SEAM between them was the
      # thing that had to be decided (plan §12.5).
      #
      # `test_reed_signature.py` is in this list and that is not padding. The reed's step ordering
      # -- open-end pin, then the source hook, then the radiating drain, then momentum -- is
      # load-bearing and NO energy test can see it: get it wrong and the reed still oscillates and
      # the books still roughly balance. The project's own reed work established that balance is
      # not a sufficient detector there and the signature is, so the signature runs here.
      #
      # `test_bore_radiation.py` and `web/serialize.py` also read `_open_left`/`_open_right`, and
      # `reed.py` reads `_bc_left` -- three more private names that are part of the surface, for
      # the same reason `_accel` was (plan §12.2).
      - name: The bore, the reed and their tests, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10             tests/test_bore_energy.py             tests/test_bore_modal.py             tests/test_bore_radiation.py             tests/test_bore_stability.py             tests/test_reed_energy.py             tests/test_reed_signature.py             tests/test_reed_stability.py

      # Phase 2 batch 4's success condition -- the air node, and the first batch whose claim is
      # NOT bit-identity.
      #
      # `radiation.RadiatedBody.step` reads `np.dot(b.a, b.q - q_nm1)` and feeds that number into
      # the next state rather than reading it out, so OpenBLAS's fused multiply-add reaches the
      # trajectory. Which kernel OpenBLAS picks is a property of the runner's CPU, so the bar is
      # the plan's Group A target and not zero (plan section 14).
      #
      # The subtlety that decides what this step actually proves: every multi-mode body the suite
      # hands these classes uses `phi=1.0` and no `radiation` weight, so `a_i = 1`, every product
      # inside that `np.dot` is exact, and the fused and rounded forms are indistinguishable.
      # Under this flag the divergence is therefore exactly zero -- a real property of these
      # tests, not a measurement of the port. The measurement is in
      # `test_rust_parity_radiation.py`, which builds a body whose weights are NOT powers of two
      # on purpose. (Checked, not assumed: the largest ModalBody anywhere in the repo is five
      # modes, below OpenBLAS's 16-term vectorisation threshold -- above which the summation ORDER
      # diverges even when every product is exact.)
      #
      # `test_web_backend.py` is in the list because `web/serialize.py` hands a `RadiatedBody` to
      # `StringBodyBridge` as the body -- so the flag puts a Rust wrapper inside a Python bridge,
      # which is the `__getattr__` delegation surface and nothing in `tests/test_radiation.py`
      # exercises it. It costs this job ~13 minutes on its own, and that is deliberate: section
      # 13.7 measured that file by hand instead, and by-hand is not a gate.
      #
      # Four of the six files also appear in the batch-2 and batch-3 steps above. That redundancy
      # is the convention this job already follows -- each step's list is a CLAIM about one
      # batch's swap, not a partition of the suite.
      - name: The air node and its clients, unmodified, against Rust
        env:
          PHYSSYNTH_RS: "1"
        run: |
          pytest --durations=10 \
            tests/test_radiation.py \
            tests/test_bore_radiation.py \
            tests/test_airbox_freefield.py \
            tests/test_airbox_scene.py \
            tests/test_connection.py \
            tests/test_web_backend.py

      # The comparison the physics bars are too loose to make: state arrays bit-for-bit, energy to
      # the plan's Group A target, and the buffer-lifetime properties that no physics test can see.
      # Runs WITHOUT the flag -- it imports both implementations by name and needs neither swapped.
      #
      # The bare `import` first is not belt-and-braces. `test_rust_parity.py` opens with a
      # module-level `pytest.importorskip`, so a failed or missing install SKIPS the file and the
      # step exits 0 having asserted nothing at all -- the same shape as the empty-sum hazard the
      # `checks` job below documents. The skip is right for the shard run, where the extension is
      # genuinely absent; it is wrong here, where its absence is the failure.
      - name: Rust vs Python parity
        run: |
          python -c "import physsynth_rs; print(physsynth_rs.__file__)"
          pytest --durations=10 \
            tests/test_rust_parity.py \
            tests/test_rust_parity_operators.py \
            tests/test_rust_parity_ops2d.py \
            tests/test_rust_parity_membrane.py \
            tests/test_rust_parity_body.py \
            tests/test_rust_parity_bore.py \
            tests/test_rust_parity_reed.py \
            tests/test_rust_parity_radiation.py

  # Lint, plus the OUTER half of the shard guard.
  #
  # The inner half is `tests/test_shard_partition.py`, which asserts the split covers `tests/`
  # exactly once — but it cannot catch a split that dropped the file it lives in, because then it
  # does not run. So this job asks pytest itself, four times over, and does the arithmetic: the
  # shards' collected counts must sum to the whole suite's. That subtraction is the only thing that
  # can tell "everything ran, in pieces" apart from "a piece never ran and every job was green".
  checks:
    name: Lint + shard reconciliation
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      # Collection output is captured, never echoed: it is one line per test, and 4 x 1800 lines of
      # ids would bury the two numbers this job exists to print.
      #
      # `set -euo pipefail` is load-bearing, not boilerplate. Without `pipefail` the exit status of
      # `pytest | grep` is GREP's, so a collection error inside pytest is invisible here; and without
      # the emptiness check `sum=$((sum + ))` is a silent no-op rather than an error, so a shard that
      # half-collected could still reconcile. A guard that can pass quietly is the failure it exists
      # to catch, one level down.
      - name: Shard split covers the suite exactly once
        run: |
          set -euo pipefail
          count_collected() {
            pytest --collect-only "$@" | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+'
          }
          total=$(count_collected)
          test -n "$total"
          sum=0
          for i in $(seq 1 ${{ needs.setup.outputs.count }}); do
            files=$(python scripts/shard_tests.py --shard "$i" --of ${{ needs.setup.outputs.count }})
            n=$(count_collected $files)
            test -n "$n"
            echo "shard $i: $n tests"
            sum=$((sum + n))
          done
          echo "shards sum to $sum; whole suite collects $total"
          test "$sum" -eq "$total"
