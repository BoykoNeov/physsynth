name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Nightly, 04:00 UTC — this is where the SECOND interpreter is covered (see the matrix below).
    - cron: "0 4 * * *"
  workflow_dispatch:

# What sets this workflow's wall (measured 2026-09-29, run 36489946068)
# ---------------------------------------------------------------------
# The Python suite used to be split over three runners (2026-08-17), because it was ~15 min of
# bulk-bound simulation. The deletions moved that simulation into Rust: the three shards ran
# 41 s, 41 s and 86 s of tests, so the split bought nothing and cost two runners, a planning job,
# a partition script with its cost table and self-test, and a reconciliation step. It is ONE job
# again, and every guard that existed only for the split went with it rather than being left to
# guard a partition of one.
#
# The wall was the `rust` job, ~19 min, and ~10 of that was its UNOPTIMISED pass -- of which ~8
# was the viewer crate re-rendering whole scenes in debug. That pass is now its own job
# (`rust-debug`) and covers the crates whose tests the both-profiles rule is about. See there.
jobs:
  validate:
    name: Validation harness (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel 3.12 because 3.11 went red: when the two disagree, the disagreement IS the
      # finding, and cancelling one hides it.
      fail-fast: false
      matrix:
        # Pushes and PRs pay for one interpreter and the nightly pays for both. This is pure-numeric
        # code whose failures have never once been interpreter-specific (the one real split in this
        # repo's history was Windows vs Linux, an axis the matrix does not even cover).
        # fromJSON is required: a matrix value must be an ARRAY, and the ternary yields a string.
        python-version: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["3.11","3.12"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # THE WHEEL IS INSTALLED HERE, and this job stopped being the pure-Python baseline on
      # 2026-09-03. That is a decision (the human's, plan 39.6 route 1), not a convenience: with
      # `physsynth/core/string_ideal.py` reduced to a re-export of `physsynth_rs`, there is no
      # pure-Python path left to run, and a job that skipped what it could not import would report
      # green while asserting nothing about the model. See plan 39.6 for the two rejected routes.
      #
      # This job was paired with `rust-harness` -- the same shards with `PHYSSYNTH_RS=1` -- and the
      # pair split a physics regression from a port regression while any module still had a Python
      # body to run here. This comment said the distinction would end when the last body went, "at
      # which point these two jobs are the same run and one of them should be removed". Phase A
      # (python-retirement-plan §21) deleted the last three and the flag with them, so
      # `rust-harness` is gone and this is the one run of the suite.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ./crates/physsynth-py

      # `-n auto` = one worker per available core (4 on a standard runner; `nproc` is echoed so the
      # divisor is on the record next to the numbers it divides).
      # `--dist loadgroup` scatters tests freely EXCEPT where a module carries
      # `pytest.mark.xdist_group`, which keeps its expensive module-scoped fixtures on one worker.
      # conftest.py pins each worker to a single BLAS thread so the pool does not oversubscribe.
      #
      # NO `-q` HERE. `pyproject.toml` already sets `addopts = "-q"`, so passing it again makes it
      # `-qq`, which suppresses the `N passed in …` summary entirely — a green run and a red run
      # then end the same way on screen. Verified both ways on 2026-08-10.
      #
      # `--durations=25` is free (it only reports what pytest already timed), and it is how to see
      # the job going chain-bound: when one file's setup approaches the job's own wall, the fix
      # moves inside that file (the per-fixture `xdist_group`s are that fix, already made).
      - name: Run validation harness
        run: |
          echo "cores: $(nproc)"
          pytest -n auto --dist loadgroup --durations=25

  # The Rust migration's gate (docs/dev/rust-migration-plan.md).
  #
  # A SEPARATE job, deliberately not a step inside `validate`: the native bars and the
  # binding's own properties are a different question from the Python suite, and keeping them
  # apart keeps the answer legible when one goes red and the other does not.
  #
  # Two things are checked, in increasing order of what they cost to discover:
  #   1. the crates compile, are formatted, and pass clippy;
  #   2. `cargo test` — the native physics bars, plus the Cargo dependency allowlist that is the
  #      Rust half of the portability contract (plan §2.2).
  #
  # There used to be a third: the EXISTING Python tests, unmodified, run against the Rust model via
  # `PHYSSYNTH_RS` -- first as twenty-one per-batch steps here, then as the whole-suite
  # `rust-harness` job (plan §35.7), which was the migration's actual success condition. Phase A of
  # the retirement plan (§21) deleted the last Python bodies and the flag with them, so the plain
  # `validate` job now runs exactly what `rust-harness` ran: measured before the deletion, the
  # flagged suite minus the parity files was 1,920 passed, and after it the unflagged suite is
  # 1,940 -- the 20 reconciled per file (§21.1: +28 harvested into the binding-surface file, -8
  # from guards over the deleted machinery). One run of the suite, not two identical ones.
  rust:
    name: Rust core (compile, native bars, binding surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PINNED, not `stable`. `clippy -- -D warnings` below turns every lint a new stable release
      # introduces into a red gate on an unrelated push, and this repo has already paid for unread
      # red runs twice. Bumping is a deliberate edit: change the version here, run
      # `cargo clippy --workspace --all-targets -- -D warnings` locally, fix what the new release
      # noticed, and land both together.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      # Rust compile times for a numeric crate are minutes and the cache is the difference between
      # tolerable and not (plan §7). Keyed on Cargo.lock, which is committed for exactly this kind
      # of reason -- a floating resolution would both miss the cache and move the numbers.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      # Runs `crates/physsynth-core/tests/` — the native energy/passivity/modal bars, and the
      # dependency allowlist. No interpreter involved, so a failure here is the physics or the
      # crate graph, never the binding.
      #
      # The WHOLE suite runs in `--release`: that is the codegen the wheel ships, and it is the
      # profile where a test pinning an arithmetic spelling can go vacuous (plan §17.2, §23.5 —
      # LLVM folds a literal exponent, so the pin compares a value with itself). The debug half of
      # that rule is the `rust-debug` job below, which runs in parallel with this one.
      - name: Native validation + dependency allowlist
        run: cargo test --workspace --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `physsynth` and `physsynth-rs` are two distributions on purpose (see
      # crates/physsynth-py/pyproject.toml): the pure-Python side stays installable on its own, so
      # the baseline it defines stays available. The wheel is abi3-py311, so this 3.12 job builds
      # and exercises the same binary a developer's 3.13/3.14 does.
      #
      # `pip install ./crates/physsynth-py` looks like it should not work -- the crate has a path
      # dependency on `../physsynth-core`, which is outside the directory being installed. It does:
      # pip builds a local directory IN TREE, so the relative path resolves and the compile lands
      # in the shared workspace `target/` that the cache step above restored. Verified 2026-08-26,
      # with and without build isolation. Do not "fix" this into a copy-out-and-build.
      - name: Install both sides
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ./crates/physsynth-py

      - name: Record what decides the last bit
        # NumPy carries its own vectorised transcendentals, dispatched by CPU feature, while
        # the Rust port calls libm -- so which agreement claims below can hold is a property
        # of this machine. Two runs of identical code disagreed on 2026-08-27 (plan 22).
        # When one of them next goes red, this is the first thing to compare.
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          python -c "import numpy; numpy.show_runtime()"

      # The binding's own properties, and the 2-D builders held against SciPy.
      #
      # This step was "Rust vs Python parity", and its list DRAINED one file per deletion (plan
      # section 39's units). Phase A (retirement plan §21) took the last two comparisons, operators
      # and banded, so nothing here compares two implementations any more. What is left:
      # `test_binding_surface.py`, the properties of the BINDING that neither a physics bar nor a
      # native Rust bar can see (buffer lifetime, what `state` hands out, PyO3's argument mapping),
      # and `test_rust_parity_ops2d.py`, whose Python side went with unit 5 and which now measures
      # the Rust builders against SciPy's own sparse products and the guitar outline's margin. Both
      # also run in `validate`; they run again here for `-rP`, whose reports are the point.
      #
      # `tests/test_rust_parity.py` itself went with unit 8 (plan section 45). Emptying a list
      # rather than deleting the file would have left a `parametrize` over nothing, which COLLECTS
      # AS A SKIP: a green log asserting nothing.
      #
      # The bare `import` first is not belt-and-braces. Every file below opens with a
      # module-level `pytest.importorskip`, so a failed or missing install SKIPS them and the
      # step exits 0 having asserted nothing at all -- a guard that passes quietly is the failure
      # it exists to catch, one level down.
      - name: Binding surface and the 2-D builders against SciPy
        run: |
          python -c "import physsynth_rs; print(physsynth_rs.__file__)"
          # `-rP` prints the captured stdout of tests that PASSED. Several of these measure a
          # separation and report it rather than asserting a number that would be a claim
          # about the machine (plan 22.1); without this the reports are discarded on exactly
          # the runs where they are the news.
          pytest --durations=10 -rP \
            tests/test_binding_surface.py \
            tests/test_rust_parity_ops2d.py

      # PHASE 7'S SUCCESS CONDITION STOOD HERE and is retired with unit 10 and unit 11
      # (plan §44). It ran the instrument's 65 client files with BOTH flags set, because that was
      # the only configuration in which a Rust detector measured a Rust model -- everywhere else,
      # `PHYSSYNTH_RS` alone left the *instrument measuring the models* in Python, which is the
      # separation §36.4 built the second flag for.
      #
      # `physsynth/analysis/` has no Python body any more, so `PHYSSYNTH_RS_ANALYSIS` selects
      # between one implementation and itself. The step it gated became a strict subset of the
      # whole-suite flagged job, and since phase A (retirement plan §21) of the plain `validate` run, which
      # run those 65 files against exactly the same Rust detector. Keeping it would be running 65
      # files twice and calling the second run a different claim.
      #
      # What replaces the *other* half of that claim -- a Rust instrument checked against a second
      # implementation -- is `tests/test_analysis_frozen.py`, which holds 62 fixtures' worth of
      # what the Python oracles said, recorded to the last digit before they were deleted. It runs
      # in `validate`, and needs no environment at all.
      #
      # The derivation that built this step's file list is worth keeping on the record even though
      # the step is gone, because the lesson outlived it: the obvious grep -- files importing
      # `physsynth.analysis` -- was WRONG BY 43 FILES, since `tests/helpers.py` imports the
      # instrument and measures on its callers' behalf. 27 files matched; 65 actually reached. A
      # derived list is only as honest as the reachability it models (ledger #32).

  # The UNOPTIMISED half of "run it in both profiles", in parallel with `rust` rather than after it.
  #
  # Two things only a debug build does: `debug_assert!` fires, and LLVM does not fold a literal
  # exponent, so a test pinning an arithmetic SPELLING asserts something here that it cannot in
  # release (plan §17.2, §23.5). Every such pin, and every `debug_assert!`, is in the CORE and
  # ANALYSIS crates, so those crates' test files run here, all of them by default.
  #
  # The viewer's integration tests do NOT run here. They render whole scenes, pin no spelling, and
  # were ~490 s of this pass's ~615 s (run 36489946068) against ~310 s in release. Its inline unit
  # tests still do (`--workspace --lib`). The exclusion is by CRATE, not by file name, because the
  # viewer reuses core's names (`mallet`, `membrane`, `plate`, `reed`): the old basename list
  # excluded the viewer's `plate.rs` by accident while meaning core's (plan §23.13).
  #
  # `release_only` is the core files that are long trajectories (495 s, 353 s and 64 s unoptimised,
  # 2026-09-23; `plate_grain` 304 s, 2026-09-29, the human's call, retirement plan §25.5). Three pin
  # no spelling; `plate_grain`'s two exact checks use no transcendental and no constant exponent, so
  # release cannot fold them differently. It is an exclusion on purpose: a new core test file lands
  # in both profiles by default, and a stale name here fails the step.
  rust-debug:
    name: Rust core, unoptimised (debug asserts, unfolded arithmetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Core and analysis bars, unoptimised
        run: |
          release_only="connection_plate mallet_gong plate plate_grain"
          for n in $release_only; do
            ls crates/physsynth-core/tests/$n.rs > /dev/null || { echo "no core test $n"; exit 1; }
          done
          targets=""
          for f in crates/physsynth-core/tests/*.rs; do
            n=$(basename "$f" .rs)
            case " $release_only " in *" $n "*) continue ;; esac
            targets="$targets --test $n"
          done
          cargo test --workspace --lib
          cargo test -p physsynth-analysis --tests
          cargo test -p physsynth-core $targets

  # Lint only. This job used to pay a Rust compile and a wheel install, because it also counted the
  # suite's collected tests per shard to prove the split dropped nothing; with one Python job there
  # is nothing to reconcile, and ruff needs neither.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .

  # The web viewer's payloads, against the Python viewer's own outputs frozen before it was deleted
  # (`crates/physsynth-viewer/tests/frozen.rs`, retirement plan §23.19). EXACT agreement is a claim
  # about the platform's math library as well as the code — `sin`, `exp` and `ln` come from the C
  # runtime — and the payloads were recorded on x86_64-pc-windows-msvc. Measured 2026-09-28: a
  # windows-latest runner reproduced all 588 to the bit, the Linux runner differed in 158 (last-bit
  # drift, amplified to ~1e-6 by the parametric scene's own growth). So the exact comparison runs
  # HERE; the Linux `rust` job runs the same file in structure-only mode (keys, types, lengths,
  # ints, strings), which holds on any platform.
  frozen-windows:
    name: Viewer freeze, exact (the recording platform)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: The frozen viewer payloads, exactly
        run: cargo test --release -p physsynth-viewer --test frozen
