[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "physsynth"
version = "0.1.0"
description = "Energy-based physical-modeling sound synthesis (accuracy-first FDTD core)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Boyko Neov" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# No plotting extra: `physsynth/viz/` and the matplotlib diagnostics went at retirement plan §22.
# The browser viewer (`crates/physsynth-viewer` + `web/static/`) is the project's visualization.
dev = ["pytest>=7.4", "pytest-xdist>=3.5"]

[tool.hatch.build.targets.wheel]
packages = ["physsynth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F = pyflakes/pycodestyle; I = isort; NPY = numpy-specific; UP = pyupgrade.
select = ["E", "F", "I", "NPY", "UP", "B"]
ignore = ["E741"]  # ambiguous var name `l` — it is the standard grid index here.
