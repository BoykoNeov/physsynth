[package]
name = "physsynth-core"
description = "Headless DSP core — energy-based FDTD resonators. No I/O, no graphics, no Python."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The shipped dependency list. Keeping it EMPTY is the Rust half of the portability contract
# (plan §2.2); `tests/deps.rs` enforces it against `cargo metadata`, and adding a name here without
# also adding it to that test's allowlist is a hard failure. That is deliberate: a new dependency
# of the core is a reviewed edit in two places, never a silent one.
[dependencies]

# Test-only. Excluded from the allowlist rule by construction — `tests/deps.rs` walks NORMAL and
# BUILD edges only, and asserts that serde_json itself is absent from what it walks, so the
# exclusion is self-testing rather than asserted.
[dev-dependencies]
serde_json = "1"
# Test-only, and outside the allowlist rule for the same reason serde_json is (`tests/deps.rs`
# walks normal and build edges only). The free orthotropic plate's bars check the operator against
# the analysis crate's closed forms — the twist bound and the coupling form — which is the claim the
# Python file made, and copying the two formulas into the test would leave the analysis crate's
# versions unchecked against the plate (retirement plan §24, the human's call 2026-09-29).
# `physsynth-analysis` depends on nothing, so this adds no cycle.
physsynth-analysis = { path = "../physsynth-analysis" }
