[package]
name = "physsynth-analysis"
description = "Measurement of what the core produces — spectra, oracles, convergence. No I/O, no Python."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Empty, and held empty by `tests/deps.rs` exactly as `physsynth-core`'s is. The two crates keep
# separate allowlists rather than sharing one because they are separate arguments: the core's
# emptiness is the portability contract (plan §2.2), and this one's is the weaker claim that
# measuring a trajectory needs no more than arithmetic. An FFT is the obvious thing to reach for a
# crate over, and this file is where that argument would have to be had.
[dependencies]

[dev-dependencies]
# `float_roundtrip` is load-bearing, as it is in core and the viewer: without it serde_json parses a
# decimal to a neighbouring double, and `tests/analysis_frozen.rs` reads its record — inputs and
# answers — as exact doubles. Asked for HERE rather than inherited, because a workspace build would
# unify it in from core's dev-dependency while `cargo test -p physsynth-analysis` would not. The
# record's checksum test is what notices if it goes.
serde_json = { version = "1", features = ["float_roundtrip"] }
